services:
  channel-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: channel
    ports:
      - "5432:5432"
    volumes:
      - channel-db-data:/var/lib/postgresql

  notification-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: notification
    ports:
      - "5433:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql
  
  message-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: message
    ports:
      - "5434:5432"
    volumes:
      - message-db-data:/var/lib/postgresql

  message-client-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  channel-service:
    build:
      context: .
      dockerfile: ChannelService/Dockerfile
    depends_on:
      - channel-db
      - message-client-rabbitmq
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__DbConnectionString: "Host=channel-db;Port=5432;Database=channel;Username=admin;Password=admin"
      AppOptions__RABBITMQ_HOST: "host=message-client-rabbitmq"

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    depends_on:
      - notification-db
      - message-client-rabbitmq
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__DbConnectionString: "Host=notification-db;Port=5433;Database=notification;Username=admin;Password=admin"
      AppOptions__RABBITMQ_HOST: "host=message-client-rabbitmq"
  
  messaging-service:
    build:
      context: .
      dockerfile: MessagingService/Dockerfile
    depends_on:
      - message-db
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__DbConnectionString: "Host=message-db;Port=5434;Database=message;Username=admin;Password=admin"

  message-client:
    build:
      context: .
      dockerfile: MessageClient/Dockerfile
    depends_on:
      message-client-rabbitmq:
        condition: service_healthy
    
    ports:
      - "8000:80"

volumes:
  channel-db-data:
  notification-db-data:
  message-db-data: