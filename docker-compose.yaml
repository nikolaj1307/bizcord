services:
  channel-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: channel
    ports:
      - "5432:5432"
    volumes:
      - channel-db-data:/var/lib/postgresql

  notification-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: notification
    ports:
      - "5433:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql

  message-client-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  channel-service:
    build:
      context: .
      dockerfile: ChannelService/Dockerfile
    depends_on:
      - channel-db
      - message-client-rabbitmq
      - fluentd
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: channel-service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__DbConnectionString: "Host=channel-db;Port=5432;Database=channel;Username=admin;Password=admin"
      AppOptions__RABBITMQ_HOST: "host=message-client-rabbitmq"

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    depends_on:
      - notification-db
      - message-client-rabbitmq
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOptions__DbConnectionString: "Host=notification-db;Port=5433;Database=notification;Username=admin;Password=admin"
      AppOptions__RABBITMQ_HOST: "host=message-client-rabbitmq"

  message-client:
    build:
      context: .
      dockerfile: MessageClient/Dockerfile
    depends_on:
      message-client-rabbitmq:
        condition: service_healthy
    ports:
      - "8000:80"
  
  fluentd:
    build: ./fluentd
    volumes:
      - ./fluentd/conf:/fluentd/etc
    depends_on:
      # Launch fluentd after that elasticsearch is ready to connect
      elasticsearch:
        condition: service_healthy
    ports:
      - "24224:24224"
      - "24224:24224/udp"
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: elasticsearch
    hostname: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disable security for testing
    healthcheck:
      # Check whether service is ready
      test: [ "CMD", "curl", "-f", "http://localhost:9200/_cluster/health" ]
      interval: 10s
      retries: 5
      timeout: 5s
    ports:
      - 9200:9200
    
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.1
    depends_on:
      # Launch fluentd after that elasticsearch is ready to connect
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"

volumes:
  channel-db-data:
  notification-db-data:
